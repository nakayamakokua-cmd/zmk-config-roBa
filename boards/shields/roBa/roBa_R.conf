CONFIG_ZMK_KEYBOARD_NAME="roBa"

CONFIG_ZMK_POINTING=y
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_ZMK_BLE=y



CONFIG_SPI=y
CONFIG_INPUT=y

CONFIG_PMW3610=y
CONFIG_PMW3610_CPI=1200
CONFIG_PMW3610_CPI_DIVIDOR=1
CONFIG_PMW3610_ORIENTATION_0=y
# CONFIG_PMW3610_SNIPE_CPI=800
# CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=4
CONFIG_PMW3610_SCROLL_TICK=16
CONFIG_PMW3610_INVERT_X=n
CONFIG_PMW3610_INVERT_SCROLL_X=y
# ボールスクロールの縦向き反転(2026-08-14 中山指摘)。横(X)は元から反転済みで縦だけ素のままだった。
# pmw3610.h の PMW3610_SCROLL_Y_POSITIVE/NEGATIVE の符号を入れ替えるだけで、
# 効くのは input_mode==SCROLL の分岐のみ = カーソル移動には影響しない。
CONFIG_PMW3610_INVERT_SCROLL_Y=y
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
#CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=9600
#CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST3_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_FORCE_AWAKE=n
CONFIG_PMW3610_POLLING_RATE_125_SW=y
# ボールを止めてからマウス層が閉じるまでの時間。動かすたびに測り直し(延長)される。
#
# 🔴 2026-08-27に 700→400 にしたが【同日 700 へ差し戻した】。
#    狙いを定める操作は「動かす→止めて確認→微調整」の繰り返しで、止めている時間が
#    0.4秒を超えるとその時点で層が閉じ、クリックしようとした時には効かない。
#    敷居0に戻すだけでは足りず、ここも元に戻さないと「押せない」が残る。
#    誤爆対策としては効いていたが、クリックできない代償が大きすぎる。
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=700

# マウス層を開くのに必要な1サンプル(8ms)あたりの移動量(カウント)。
#
# 🔴 2026-08-27に 0→10 にしたが【同日、実機で使い物にならず 0 へ差し戻した】。
#    症状(中山): 「カーソルは動くのにクリックだけ全く効かない。バツボタンに
#    合わせに行くと押せない」。
#    機序: この判定は【1サンプル(8ms)あたりの移動量】を見る。狙いを定める動きは
#    低速で細かいため1サンプルあたりの移動量が敷居に届かず、マウス層が開かない。
#    一方カーソル移動は層と無関係に出力されるので「動くのに押せない」になる。
#    🔴 つまりこの敷居は「打鍵中のかすめ」と「狙いを定める低速操作」を区別できない。
#       どちらも低速だから。値を下げても両方が同時に戻るだけで、分離はできない。
#    → 誤爆対策は敷居ではなく【MOUSE層に破壊的なキーを置かない】側で解くこと。
#      (誤爆の実害は K=⌘A(全選択)・カンマ=⌘V・ピリオド=⌘X に由来する)
CONFIG_PMW3610_MOVEMENT_THRESHOLD=0

CONFIG_PMW3610_SMART_ALGORITHM=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n 

# behavior queue の長さ。既定64。
# エンコーダは1目盛りごとに「押す」「離す」の2枚をこの共有行列へ積み、
# 1目盛りが tap-ms ぶん行列を占有する(直列処理)。溢れると
# zmk_behavior_queue_add の戻り値は捨てられるため黙って落ち、
# 「離す」だけが消えると &msc の速度がゼロに戻らず永久スクロールになる。
# 2026-08-14に実機で発生したため 64→256 に拡張(バッファ1.28秒→約6.4秒相当)。
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=256
